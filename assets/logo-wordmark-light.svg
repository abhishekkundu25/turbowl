<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 320" width="1240" height="320" role="img" aria-labelledby="t">
  <title id="t">TurbOWL: fast, verified OWL 2 RL reasoning in Rust</title>
  <defs>
    <linearGradient id="amberText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
  </defs>
  <svg x="0" y="10" width="300" height="300" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#16407A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#C9DCFA"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="175" y2="0">
      <stop offset="0" stop-color="#FF8A1F" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFC94D"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- speed streaks -->
  <g stroke="url(#streak)" stroke-linecap="round" stroke-width="22">
    <line x1="58" y1="212" x2="150" y2="212"/>
    <line x1="86" y1="262" x2="160" y2="262" opacity="0.75"/>
    <line x1="112" y1="312" x2="168" y2="312" opacity="0.5"/>
  </g>
  <!-- owl -->
  <path d="M204 160 Q206 128 222 112 Q240 132 266 140 Q294 132 322 140 Q348 132 366 112 Q382 128 384 160 Q414 206 408 284 Q400 372 294 424 Q188 372 180 284 Q174 206 204 160 Z" fill="url(#body)"/>
  <!-- wings -->
  <path d="M184 262 Q192 352 270 410 Q228 338 236 270 Z" fill="#AFC8F0"/>
  <path d="M404 262 Q396 352 318 410 Q360 338 352 270 Z" fill="#AFC8F0"/>
  <!-- facial discs -->
  <circle cx="254" cy="226" r="52" fill="#DCE7FA"/>
  <circle cx="334" cy="226" r="52" fill="#DCE7FA"/>
  <!-- eyes -->
  <g>
    <circle cx="254" cy="226" r="40" fill="url(#amber)"/>
    <circle cx="334" cy="226" r="40" fill="url(#amber)"/>
    <circle cx="254" cy="226" r="27" fill="#FFFFFF"/>
    <circle cx="334" cy="226" r="27" fill="#FFFFFF"/>
    <circle cx="260" cy="228" r="14" fill="#0B1F3A"/>
    <circle cx="340" cy="228" r="14" fill="#0B1F3A"/>
    <circle cx="265" cy="222" r="4.5" fill="#FFFFFF"/>
    <circle cx="345" cy="222" r="4.5" fill="#FFFFFF"/>
  </g>
  <!-- beak -->
  <path d="M294 262 L279 280 L294 302 L309 280 Z" fill="url(#amber)"/>
  <!-- a triple on the chest -->
  <g stroke="#16407A" stroke-width="7" stroke-linecap="round">
    <line x1="264" y1="340" x2="324" y2="340"/>
    <line x1="264" y1="340" x2="294" y2="384"/>
    <line x1="324" y1="340" x2="294" y2="384"/>
  </g>
  <g fill="#0B1F3A">
    <circle cx="264" cy="340" r="11"/>
    <circle cx="324" cy="340" r="11"/>
    <circle cx="294" cy="384" r="11"/>
  </g>
</svg>
  <text x="330" y="190" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-3"><tspan fill="#0B1F3A">Turb</tspan><tspan fill="url(#amberText)">OWL</tspan></text>
  <text x="336" y="258" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="500" fill="#4A5B75">fast, verified OWL 2 RL reasoning in Rust</text>
</svg>
