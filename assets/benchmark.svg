<text x="28" y="528" class="foot">Triples: input → closure. Loading and reasoning, median of 3 runs, open-source engines Nemo 0.10.1, Soufflé 2.5 and VLog 1.3.7.</text>
<text x="28" y="545" class="foot">Each row has its own linear scale. The ratio compares TurbOWL on one thread with the fastest of them. Nemo and Soufflé run on one</text>
<text x="28" y="562" class="foot">thread; VLog's thread count could not be set. We wrote each engine's rule program from the W3C rules. Tuned by their authors, they may be faster.</text>
