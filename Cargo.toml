[workspace]
resolver = "3"
members = ["crates/turbowl", "crates/cli", "crates/python", "crates/oracle", "crates/reference", "crates/bench"]
default-members = ["crates/turbowl", "crates/cli"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/abhishekkundu25/turbowl"

[workspace.dependencies]
turbowl = { path = "crates/turbowl", version = "0.2.0-dev" }
oxrdf = "0.3.4"
oxttl = "0.2.4"
oxrdfxml = "0.2.4"
rustc-hash = "2.1.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

# Benchmarks and timing tests build like a release, with symbols for profiling.
[profile.bench]
inherits = "release"
debug = "line-tables-only"
