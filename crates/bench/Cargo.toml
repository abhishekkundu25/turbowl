[package]
name = "turbowl-bench"
description = "Benchmarks against other reasoners"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
turbowl.workspace = true
# The rule program Nemo runs, composed from oracles/rules/.
turbowl-oracle = { path = "../oracle" }
oxrdf.workspace = true
# Reads the change streams of the incremental scenarios from the input files.
oxttl.workspace = true
# The results file and the one-run protocol between the bench and its children.
serde_json = "1"
# getrusage (peak memory) and getloadavg: no safe std equivalent.
libc = "0.2"

[lints]
workspace = true
