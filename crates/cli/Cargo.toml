[package]
name = "turbowl-cli"
description = "The TurbOWL command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true

[[bin]]
name = "turbowl"
path = "src/main.rs"

[dependencies]
turbowl.workspace = true
# The json and ndjson reports: escaping done right, already in the lock.
serde_json = "1"
# --explain's value: one N-Triples triple, parsed by oxttl into an oxrdf
# triple. Both already in the lock through turbowl.
oxrdf.workspace = true
oxttl.workspace = true

[dev-dependencies]
# The tests parse the command's output in every format, to compare it with
# the library's closure as sets.
oxrdfxml.workspace = true

[lints]
workspace = true
