[package]
name = "turbowl"
description = "A fast OWL 2 RL reasoner, embeddable, for native and WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["io", "parallel"]
# Parsing and writing documents (Turtle, N-Triples, N3, RDF/XML).
io = ["dep:oxttl", "dep:oxrdfxml", "dep:oxiri"]
# Rounds on every core (ticket 17), on a rayon thread pool. Native only:
# on WebAssembly the dependency is left out and rounds run on one thread.
parallel = ["dep:rayon"]
# RDF 1.2 triple terms (`<<( s p o )>>`), opaque terms (the crate doc).
# An embedder that turns on `oxrdf/rdf-12` must turn this on too: the
# matches on oxrdf's terms name the `Triple` variant only under it. With
# `io`, the parsers get theirs too (oxttl and oxrdfxml match on oxrdf's
# terms as well).
rdf-12 = ["oxrdf/rdf-12", "oxttl?/rdf-12", "oxrdfxml?/rdf-12"]

[dependencies]
oxrdf.workspace = true
oxttl = { workspace = true, optional = true }
oxrdfxml = { workspace = true, optional = true }
# The IRI parser oxttl uses, called by `io/iri.rs` for parity with it.
oxiri = { version = "0.2.11", optional = true }
rustc-hash.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = { version = "1.12.0", optional = true }

[lints]
workspace = true
