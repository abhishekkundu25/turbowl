[package]
name = "turbowl"
description = "A fast OWL 2 RL reasoner, embeddable, for native and WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["io"]
# Parsing and writing documents (Turtle, N-Triples, N3, RDF/XML).
io = ["dep:oxttl", "dep:oxrdfxml"]

[dependencies]
oxrdf.workspace = true
oxttl = { workspace = true, optional = true }
oxrdfxml = { workspace = true, optional = true }
rustc-hash.workspace = true

[lints]
workspace = true
