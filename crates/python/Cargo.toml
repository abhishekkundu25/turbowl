[package]
name = "turbowl-python"
description = "Python bindings for TurbOWL (pyo3, built with maturin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The native half of the `turbowl` Python package (`turbowl._native`); the
# Python half is in `python/turbowl/`. `uv sync` (or `uv run`) in this
# directory builds it with maturin (see pyproject.toml). There is no
# `extension-module` feature: maturin sets PYO3_BUILD_EXTENSION_MODULE, and a
# plain `cargo build` links libpython like any other program.
[lib]
crate-type = ["cdylib"]

[dependencies]
turbowl.workspace = true
oxrdf.workspace = true
rustc-hash.workspace = true
pyo3 = "0.30.1"

[dev-dependencies]
# examples/minimal_cases.rs writes the minimal inputs for the pytest suite.
turbowl-oracle = { path = "../oracle" }

[lints]
workspace = true
